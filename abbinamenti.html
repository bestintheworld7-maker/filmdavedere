<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="format-detection" content="telephone=no" />
<meta name="theme-color" content="#eef1e4" />
<meta name="description" content="Scheda abbinamenti vini, gin tonic, cocktail e birre per ogni piatto — Poggio a Issi." />
<title>Abbinamenti — Poggio a Issi</title>
<script>
(function(){
  try{
    var saved = localStorage.getItem('poggio-theme');
    if(saved) document.documentElement.setAttribute('data-theme', saved);
  }catch(e){}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    /* ══════════════════════════════════════════════════════════
       POGGIO A ISSI — Abbinamenti
       Direzione: "Il Taccuino di Cantina" — un registro da sommelier,
       non un'app generica: carta paglierina, inchiostro verde bottiglia,
       accenti da etichetta (ossido/vino, ginepro/mist, rame/cocktail,
       paglia/birra, ottone per i consigli).
       ══════════════════════════════════════════════════════════ */

    :root {
      --font-display: "Fraunces", "DM Serif Display", serif;
      --font-body: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", monospace;

      --text-xs:   clamp(0.72rem, 0.68rem + 0.2vw, 0.8rem);
      --text-sm:   clamp(0.85rem, 0.8rem + 0.25vw, 0.94rem);
      --text-base: clamp(0.98rem, 0.93rem + 0.25vw, 1.06rem);
      --text-lg:   clamp(1.1rem, 1rem + 0.6vw, 1.35rem);
      --text-xl:   clamp(1.4rem, 1.15rem + 1.1vw, 1.9rem);
      --text-2xl:  clamp(1.9rem, 1.3rem + 2.4vw, 3rem);

      --space-1:0.25rem; --space-2:0.5rem; --space-3:0.75rem; --space-4:1rem;
      --space-5:1.25rem; --space-6:1.5rem; --space-8:2rem; --space-10:2.5rem;
      --space-12:3rem;   --space-16:4rem;

      --radius-sm:0.5rem; --radius-md:0.85rem; --radius-lg:1.1rem;
      --radius-xl:1.5rem; --radius-full:9999px;

      --ease: cubic-bezier(.16,1,.3,1);
      --t-fast: 140ms var(--ease);
      --t-med:  240ms var(--ease);
    }

    :root, [data-theme="light"] {
      --paper:      #eef1e4;
      --surface:    #fbf9f0;
      --surface-2:  #e7e6d3;
      --line:       #cdd0b8;
      --ink:        #242a1d;
      --ink-muted:  #5d6650;
      --ink-faint:  #6d7560;

      --vine:       #3c5731;
      --oxide:      #8a3a3a;
      --mist:       #2f6b64;
      --copper:     #8f5119;
      --straw:      #786315;
      --brass:      #8a5f19;

      --shadow-sm: 0 1px 2px rgba(30,35,20,.07);
      --shadow-md: 0 8px 22px rgba(30,35,20,.10);
      --shadow-lg: 0 18px 44px rgba(30,35,20,.14);
    }

    [data-theme="dark"] {
      --paper:      #171b12;
      --surface:    #212617;
      --surface-2:  #2a3020;
      --line:       #3d4632;
      --ink:        #ecefdf;
      --ink-muted:  #b3bca0;
      --ink-faint:  #7d8770;

      --vine:       #9dc17d;
      --oxide:      #dd9a94;
      --mist:       #86c6bd;
      --copper:     #e2a566;
      --straw:      #d3bd63;
      --brass:      #e0b45f;

      --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
      --shadow-md: 0 12px 30px rgba(0,0,0,.36);
      --shadow-lg: 0 22px 52px rgba(0,0,0,.42);
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    input  { outline: none; }
    svg { display: block; }
    ::selection { background: color-mix(in srgb, var(--vine) 30%, transparent); }

    body {
      min-height: 100dvh;
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: 1.6;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% -8%, color-mix(in srgb, var(--vine) 10%, transparent), transparent 40%),
        radial-gradient(circle at 100% 0%, color-mix(in srgb, var(--brass) 8%, transparent), transparent 35%),
        var(--paper);
      transition: background var(--t-med), color var(--t-med);
    }

    .shell, .topbar-inner, .footer {
      width: min(1080px, calc(100% - 2rem));
      margin-inline: auto;
    }

    /* ── Topbar ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
      background: color-mix(in srgb, var(--paper) 82%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      padding: var(--space-4) 0;
    }

    .brand { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }

    .brand-back {
      display: grid; place-items: center;
      width: 38px; height: 38px;
      border-radius: var(--radius-md);
      flex-shrink: 0;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink-muted);
      box-shadow: var(--shadow-sm);
      transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast);
    }
    .brand-back svg { width: 17px; height: 17px; }
    .brand-back:hover { background: var(--surface-2); color: var(--ink); border-color: var(--vine); }

    .brand-mark {
      width: 42px; height: 42px;
      border-radius: var(--radius-md);
      display: grid; place-items: center;
      flex-shrink: 0;
      background: color-mix(in srgb, var(--vine) 14%, var(--surface));
      border: 1px solid color-mix(in srgb, var(--vine) 30%, var(--line));
      color: var(--vine);
      box-shadow: var(--shadow-sm);
    }
    .brand-mark svg { width: 22px; height: 22px; }

    .brand-copy { min-width: 0; }
    .brand-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: var(--text-xl);
      line-height: 1;
      letter-spacing: -0.01em;
    }
    .brand-subtitle {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .theme-toggle {
      position: relative;
      width: 42px; height: 42px;
      border-radius: var(--radius-full);
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      display: grid; place-items: center;
      flex-shrink: 0;
      touch-action: manipulation;
      transition: border-color var(--t-fast), background var(--t-fast);
    }
    .theme-toggle:hover { border-color: var(--vine); }
    .theme-toggle svg { width: 19px; height: 19px; position: absolute; transition: opacity var(--t-fast), transform var(--t-fast); }
    .icon-sun  { color: var(--brass); opacity: 1; transform: scale(1) rotate(0deg); }
    .icon-moon { color: var(--mist);  opacity: 0; transform: scale(.5) rotate(-45deg); }
    [data-theme="dark"] .icon-sun  { opacity: 0; transform: scale(.5) rotate(45deg); }
    [data-theme="dark"] .icon-moon { opacity: 1; transform: scale(1) rotate(0deg); }

    /* ── Shell / layout ── */
    .shell { padding: var(--space-5) 0 var(--space-16); display: grid; gap: var(--space-5); }

    /* ── Stats bar ── */
    .stats { display: flex; flex-wrap: wrap; gap: var(--space-2); }

    .stat {
      display: inline-flex; align-items: center; gap: var(--space-2);
      min-height: 32px; padding: 0 var(--space-3);
      border-radius: var(--radius-full);
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink-muted);
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      font-weight: 500;
      box-shadow: var(--shadow-sm);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* ── Search ── */
    .search {
      display: flex; align-items: center; gap: var(--space-3);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 0 var(--space-4);
      min-height: 52px;
      box-shadow: var(--shadow-sm);
      transition: border-color var(--t-fast), box-shadow var(--t-fast);
    }
    .search:focus-within { border-color: var(--vine); box-shadow: var(--shadow-md); }
    .search input { width: 100%; background: transparent; border: 0; font-size: var(--text-sm); }
    .search input::placeholder { color: var(--ink-faint); }
    .search svg { color: var(--ink-faint); flex-shrink: 0; width: 18px; height: 18px; }

    /* ── Tabs ── */
    .tabs { display: flex; flex-wrap: wrap; gap: var(--space-2); }

    .tab {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 8px var(--space-4);
      border-radius: var(--radius-full);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink-muted);
      font-size: var(--text-xs);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
      transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast);
    }
    .tab svg { width: 15px; height: 15px; opacity: .8; }
    .tab:hover { border-color: var(--vine); color: var(--vine); }
    .tab.active { background: var(--vine); color: var(--surface); border-color: var(--vine); }
    .tab.active svg { opacity: 1; }

    /* ── Content area ── */
    .content { display: grid; gap: var(--space-8); }

    .section-head {
      cursor: pointer; user-select: none;
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: var(--space-4); margin-bottom: var(--space-3);
    }
    .section-head h3 {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: var(--text-lg);
      letter-spacing: -0.01em;
      line-height: 1.1;
    }
    .section-head p { color: var(--ink-faint); font-size: var(--text-xs); margin-top: 3px; }
    .section-head:hover h3 { color: var(--vine); }
    .section-chevron {
      font-family: var(--font-mono);
      font-size: .95rem; color: var(--ink-faint);
      flex-shrink: 0; align-self: center; margin-left: auto;
      transition: transform var(--t-fast);
    }

    /* ── Cards grid ── */
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
    .grid.collapsed { display: none; }

    /* ── Card (scheda di cantina) ── */
    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 3px solid var(--cat-color, var(--vine));
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      opacity: 0; transform: translateY(8px);
      animation: cardIn 420ms var(--ease) forwards;
      transition: transform var(--t-fast), box-shadow var(--t-fast), border-color var(--t-fast);
    }
    @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

    .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .card.open  { box-shadow: var(--shadow-md); }

    .card-top {
      padding: var(--space-4) var(--space-5);
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: var(--space-3); cursor: pointer;
    }

    .card-title h4 {
      font-family: var(--font-display);
      font-size: var(--text-base);
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.005em;
    }
    .card-title p {
      margin-top: 5px; color: var(--ink-muted);
      font-size: var(--text-xs); line-height: 1.5; max-width: 46ch;
    }

    .pricebox { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
    .price {
      font-family: var(--font-mono);
      font-size: var(--text-sm); font-weight: 600;
      color: var(--vine);
      background: color-mix(in srgb, var(--vine) 12%, var(--surface));
      border: 1px solid color-mix(in srgb, var(--vine) 24%, var(--line));
      padding: 2px 9px; border-radius: var(--radius-full);
      white-space: nowrap;
    }
    .chevron {
      font-size: .85rem; color: var(--ink-faint); flex-shrink: 0;
      align-self: flex-start; margin-top: 2px;
      transition: color var(--t-fast), transform var(--t-med);
    }
    .card.open .chevron { color: var(--vine); transform: rotate(180deg); }

    /* ── Preview strip (anteprima prima di aprire) ── */
    .preview {
      display: flex; align-items: center; gap: var(--space-2);
      padding: 0 var(--space-5) var(--space-4);
      flex-wrap: wrap;
    }
    .preview-chip {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: var(--text-xs); font-weight: 600;
      color: var(--chip-color, var(--ink-muted));
      background: color-mix(in srgb, var(--chip-color, var(--ink-muted)) 12%, var(--surface));
      border: 1px solid color-mix(in srgb, var(--chip-color, var(--ink-muted)) 26%, var(--line));
      padding: 3px 9px 3px 7px; border-radius: var(--radius-full);
    }
    .preview-chip svg { width: 13px; height: 13px; }
    .preview-flag {
      display: inline-flex; align-items: center; gap: 4px;
      font-family: var(--font-mono);
      font-size: 0.66rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
      color: var(--brass);
      background: color-mix(in srgb, var(--brass) 14%, var(--surface));
      border: 1px solid color-mix(in srgb, var(--brass) 30%, var(--line));
      padding: 3px 8px; border-radius: var(--radius-full);
    }
    .preview-flag svg { width: 11px; height: 11px; }
    .preview-flag.is-official { color: var(--vine); background: color-mix(in srgb, var(--vine) 14%, var(--surface)); border-color: color-mix(in srgb, var(--vine) 30%, var(--line)); }

    /* ── Detail panel ── */
    .detail {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows var(--t-med);
      border-top: 1px solid transparent;
    }
    .detail > .detail-inner { overflow: hidden; min-height: 0; }
    .card.open .detail { grid-template-rows: 1fr; border-top-color: color-mix(in srgb, var(--line) 80%, transparent); }

    .detail-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-4); padding: var(--space-5);
    }

    .detail-block {
      background: color-mix(in srgb, var(--surface-2) 60%, var(--surface));
      border: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
      border-radius: var(--radius-md);
      padding: var(--space-4);
    }

    .detail-label {
      font-family: var(--font-mono);
      font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--ink-faint); font-weight: 600; margin-bottom: var(--space-3);
      display: flex; align-items: center; gap: 6px;
    }
    .detail-label svg { width: 13px; height: 13px; }

    /* ── Pairing rows (righe del taccuino) ── */
    .pick-list { display: grid; gap: var(--space-3); }
    .pick-list li { list-style: none; }

    .pick {
      display: flex; align-items: flex-start; gap: 9px;
      padding-left: 9px;
      border-left: 2px solid color-mix(in srgb, var(--pick-color, var(--ink-faint)) 55%, transparent);
    }
    .pick-icon {
      width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px;
      color: var(--pick-color, var(--ink-muted));
    }
    .pick-icon svg { width: 100%; height: 100%; }
    .pick-body { min-width: 0; flex: 1; }

    .pick-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 8px; }
    .pick-name { font-family: var(--font-display); font-weight: 600; font-size: var(--text-sm); color: var(--ink); }
    .pick-producer { font-size: var(--text-xs); font-style: italic; color: var(--ink-faint); }
    .pick-price {
      font-family: var(--font-mono); font-size: 0.72rem; font-weight: 600;
      color: var(--pick-color, var(--ink-muted));
      background: color-mix(in srgb, var(--pick-color, var(--ink-muted)) 13%, var(--surface));
      padding: 1px 7px; border-radius: var(--radius-full);
      margin-left: auto; white-space: nowrap;
    }
    .pick-badge {
      display: inline-flex; align-items: center; gap: 3px;
      font-family: var(--font-mono); font-size: 0.62rem; font-weight: 700;
      letter-spacing: .05em; text-transform: uppercase;
      padding: 1px 6px; border-radius: var(--radius-full);
      color: var(--brass); background: color-mix(in srgb, var(--brass) 16%, var(--surface));
    }
    .pick-badge.is-official { color: var(--vine); background: color-mix(in srgb, var(--vine) 16%, var(--surface)); }
    .pick-badge svg { width: 9px; height: 9px; }

    .pick-note { font-size: var(--text-xs); color: var(--ink-muted); line-height: 1.55; margin-top: 3px; }

    .pick-alt {
      display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap;
      margin-top: 7px; padding-top: 7px;
      border-top: 1px dashed color-mix(in srgb, var(--line) 90%, transparent);
      font-size: var(--text-xs); color: var(--ink-faint);
    }
    .pick-alt .alt-tag { font-family: var(--font-mono); font-size: 0.64rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint); flex-shrink: 0; }
    .pick-alt .alt-name { font-weight: 600; color: var(--ink-muted); }
    .pick-alt .alt-price { font-family: var(--font-mono); color: var(--ink-faint); }
    .pick-alt .alt-note { color: var(--ink-faint); }

    /* ── Note operative ── */
    .notes-section {
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 3px solid var(--brass);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .notes-section ul { padding: var(--space-5); display: grid; gap: var(--space-3); }
    .notes-section li {
      list-style: none;
      display: flex; gap: 10px;
      font-size: var(--text-sm); color: var(--ink); line-height: 1.6;
    }
    .note-index {
      font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 600;
      color: var(--brass); flex-shrink: 0; padding-top: 1px;
    }

    /* ── Empty state ── */
    .empty {
      padding: var(--space-10) var(--space-5);
      text-align: center; color: var(--ink-muted);
      background: var(--surface);
      border: 1px dashed var(--line);
      border-radius: var(--radius-lg);
    }
    .empty svg { width: 34px; height: 34px; color: var(--ink-faint); margin: 0 auto var(--space-3); }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .grid        { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 760px) {
      .topbar-inner, .shell, .footer { width: min(100%, calc(100% - 1.2rem)); }
      .brand-subtitle { display: none; }
    }

    @media (max-width: 480px) {
      .tabs    { gap: 6px; }
      .tab     { font-size: 0.72rem; padding: 7px var(--space-3); }
      .card-top { padding: var(--space-4); }
      .preview { padding: 0 var(--space-4) var(--space-3); }
      .detail-grid { padding: var(--space-4); gap: var(--space-3); }
    }

    /* Focus visibile per accessibilità */
    :focus-visible { outline: 2px solid var(--vine); outline-offset: 2px; border-radius: var(--radius-sm); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .card { opacity: 1; transform: none; animation: none; }
    }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <a href="index.html" class="brand-back" aria-label="Torna alla home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="9" cy="8" r="2.3"/><circle cx="15" cy="8" r="2.3"/>
          <circle cx="6.3" cy="12" r="2.1"/><circle cx="12" cy="12" r="2.1"/><circle cx="17.7" cy="12" r="2.1"/>
          <circle cx="9" cy="15.6" r="1.9"/><circle cx="15" cy="15.6" r="1.9"/>
          <circle cx="12" cy="18.8" r="1.7"/>
          <path d="M12 3v3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        </svg>

/* ── Parser dei testi di abbinamento (icona → categoria, nome, produttore, prezzo, motivo, alternativa) ── */
function parseSegment(seg){
  var starred = seg.indexOf('⭐') !== -1;
  var official = seg.indexOf('✅') !== -1;
  seg = seg.replace(/⭐/g,'').replace(/✅/g,'').replace(/\s+/g,' ').trim();

  var parenMatches = [], re = /\(([^()]*€[^()]*)\)/g, m;
  while((m = re.exec(seg))) parenMatches.push(m);

  var price = null, namePart = seg, rationale = '';
  if(parenMatches.length){
    var last = parenMatches[parenMatches.length - 1];
    price = last[1];
    var beforeParen = seg.slice(0, last.index).trim();
    var afterParen = seg.slice(last.index + last[0].length).trim();
    namePart = beforeParen;
    afterParen = afterParen.replace(/^[—–-]\s*/, '');
    rationale = afterParen;
  }

  var name = namePart, producer = null;
  var dashIdx = namePart.indexOf(' – ');
  if(dashIdx !== -1){
    name = namePart.slice(0, dashIdx).trim();
    producer = namePart.slice(dashIdx + 3).trim();
  }
  name = name.replace(/"([^"]*)"/g, '\u201C$1\u201D');

  return {name:name, producer:producer, price:price, rationale:rationale, starred:starred, official:official};
}

function parsePick(raw){
  var s = String(raw || '').trim();
  var chars = Array.from(s);
  var icon = chars[0];
  var rest = chars.slice(1).join('').trim();
  var ICONMAP = {'🥇':'wine','🔄':'wine','🍷':'wine','🍸':'gin','🍹':'cocktail','🍺':'beer'};
  var cat = ICONMAP[icon] || 'other';

  var labelMatch = rest.match(/^(G&T|Cocktail|Birra):\s*/);
  if(labelMatch) rest = rest.slice(labelMatch[0].length);

  var altRaw = null, mainRaw = rest;
  var altIdx = rest.indexOf('; Alt:');
  if(altIdx !== -1){
    mainRaw = rest.slice(0, altIdx).trim();
    altRaw = rest.slice(altIdx + 6).trim();
  }

  return {cat:cat, main:parseSegment(mainRaw), alt: altRaw ? parseSegment(altRaw) : null};
}

function renderPick(raw){
  var p = parsePick(raw);
  var colorVar = 'var(--' + (PICK_COLOR_VAR[p.cat] || 'ink-muted') + ')';
  var icon = PICK_ICONS[p.cat] || '';
  var badges = '';
  if(p.main.official) badges += '<span class="pick-badge is-official">'+BADGE_ICONS.check+'Ufficiale</span>';
  else if(p.main.starred) badges += '<span class="pick-badge">'+BADGE_ICONS.star+'Consigliato</span>';

  var altHtml = '';
  if(p.alt){
    altHtml = '<div class="pick-alt">'+
      '<span class="alt-tag">In alternativa</span>'+
      '<span class="alt-name">'+e(p.alt.name)+'</span>'+
      (p.alt.price ? '<span class="alt-price">'+e(p.alt.price)+'</span>' : '')+
      (p.alt.rationale ? '<span class="alt-note">— '+e(p.alt.rationale)+'</span>' : '')+
    '</div>';
  }

  return '<li class="pick" style="--pick-color:'+colorVar+'">'+
    '<div class="pick-icon">'+icon+'</div>'+
    '<div class="pick-body">'+
      '<div class="pick-head">'+
        '<span class="pick-name">'+e(p.main.name)+'</span>'+
        (p.main.producer ? '<span class="pick-producer">'+e(p.main.producer)+'</span>' : '')+
        badges+
        (p.main.price ? '<span class="pick-price">'+e(p.main.price)+'</span>' : '')+
      '</div>'+
      (p.main.rationale ? '<div class="pick-note">'+e(p.main.rationale)+'</div>' : '')+
      altHtml+
    '</div>'+
  '</li>';
}

function renderPickList(arr){
  if(!arr || !arr.length) return '';
  return '<ul class="pick-list">' + arr.map(renderPick).join('') + '</ul>';
}

  for(var j=0;j<order.length;j++){
    var c = order[j];
    if(seen[c]) html += '<span class="preview-chip" style="--chip-color:var(--'+PICK_COLOR_VAR[c]+')">'+(PICK_ICONS[c]||'')+labels[c]+'</span>';
  }
  if(official) html += '<span class="preview-flag is-official">'+BADGE_ICONS.check+'Ufficiale</span>';
  else if(starred) html += '<span class="preview-flag">'+BADGE_ICONS.star+'Consigliato</span>';
  return html;
}

function buildStats(){
  var counts = {antipasti:0,griglia:0,pinse:0,burger:0,dolci:0};
  for(var i=0;i<A.length;i++) if(counts[A[i].cat]!==undefined) counts[A[i].cat]++;
  var html = "";
  for(var k in counts){
    html += '<div class="stat"><span class="dot" style="background:var(--'+CAT_COLOR_VAR[k]+')"></span>'+CATS.find(function(c){return c.k===k;}).label+': '+counts[k]+'</div>';
  }
  document.getElementById("statsBar").innerHTML = html;
}

function card(a){
  return '<article class="card" id="c'+a.id+'" style="--cat-color:var(--'+CAT_COLOR_VAR[a.cat]+')">'+
    '<div class="card-top" onclick="tc('+a.id+')">'+
      '<div class="card-title">'+
        '<h4>'+e(a.nome)+'</h4>'+
        '<p>'+e(a.desc)+'</p>'+
      '</div>'+
      '<div style="display:flex;gap:10px;align-items:flex-start;">'+
        '<div class="pricebox"><div class="price">'+e(a.pr)+'</div></div>'+
        '<div class="chevron" id="ch'+a.id+'">▾</div>'+
      '</div>'+
    '</div>'+
    '<div class="preview">'+previewChips(a)+'</div>'+
    '<div class="detail" id="d'+a.id+'">'+
      '<div class="detail-inner">'+
      '<div class="detail-grid">'+
        '<div class="detail-block"><div class="detail-label">'+PICK_ICONS.wine+'Vini consigliati</div>'+renderPickList(a.vini)+'</div>'+
        '<div class="detail-block"><div class="detail-label">'+PICK_ICONS.cocktail+'Gin Tonic · Cocktail · Birra</div>'+renderPickList(a.bev)+'</div>'+
      '</div>'+
      '</div>'+
    '</div>'+
  '</article>';
}

function tc(id){
  var c = document.getElementById('c'+id);
  if(!c) return;
  c.classList.toggle('open');
}

function toggleSection(catKey){
  var grid = document.getElementById('sec-' + catKey);
  var chev = document.getElementById('sca-' + catKey);
  if(!grid) return;
  collapsedSections[catKey] = !collapsedSections[catKey];
  if(collapsedSections[catKey]){
    grid.classList.add('collapsed');
    if(chev) chev.textContent = '▸';
  } else {
    grid.classList.remove('collapsed');
    if(chev) chev.textContent = '▾';
  }
}

function renderNotes(){
  var q = curS.toLowerCase().trim();
  var list = [];
  for(var i=0;i<NOTES.length;i++){
    if(!q || NOTES[i].toLowerCase().indexOf(q)>-1) list.push(NOTES[i]);
  }
  if(!list.length) return emptyState('Nessuna nota trovata per \u201C'+e(curS)+'\u201D');
  var h = '<section><div class="section-head" style="cursor:default;"><div><h3>Note di sala</h3><p>Promemoria e priorità per il servizio.</p></div></div>';
  h += '<div class="notes-section"><ul>';
  for(var j=0;j<list.length;j++){
    var idx = (j+1 < 10 ? '0' : '') + (j+1);
    h += '<li><span class="note-index">'+idx+'</span><span>'+e(list[j])+'</span></li>';
  }
  h += '</ul></div></section>';
  return h;
}

function emptyState(msg){
  return '<div class="empty">'+PICK_ICONS.wine+'<div>'+msg+'</div></div>';
}

function render(){
  var s = curS.toLowerCase().trim();
  var out = "", tot = 0;

  if(curF === "note"){
    document.getElementById('main').innerHTML = renderNotes();
    return;
  }

  for(var ci=0;ci<CATS.length;ci++){
    var cat = CATS[ci];
    if(curF !== "all" && curF !== cat.k) continue;

    var list = A.filter(function(a){
      if(a.cat !== cat.k) return false;
      if(!s) return true;
      var h = (a.nome+' '+a.desc+' '+(a.vini||[]).join(' ')+' '+(a.bev||[]).join(' ')).toLowerCase();
      return h.indexOf(s) !== -1;
    });

    if(!list.length) continue;
    tot += list.length;

    out += '<section>'+
      '<div class="section-head" onclick="toggleSection(\''+cat.k+'\')" id="sh-'+cat.k+'">'+
        '<div><h3 style="display:flex;align-items:center;gap:9px;"><span style="width:19px;height:19px;color:var(--'+CAT_COLOR_VAR[cat.k]+')">'+CAT_ICONS[cat.k]+'</span>'+cat.label+'</h3><p>'+e(cat.copy)+'</p></div>'+
        '<span class="section-chevron" id="sca-'+cat.k+'">▸</span>'+
      '</div>'+
      '<div class="grid collapsed" id="sec-'+cat.k+'">'+
        list.map(card).join("")+
      '</div>'+
    '</section>';
  }

  if(curF === "all") out += renderNotes();

  if(!tot && curF !== "all"){
    out = emptyState('Nessun abbinamento trovato per \u201C'+e(curS)+'\u201D');
  }

  document.getElementById("main").innerHTML = out;
}

document.querySelectorAll(".tab").forEach(function(t){
  t.addEventListener("click", function(){
    document.querySelectorAll(".tab").forEach(function(x){ x.classList.remove("active"); });
    t.classList.add("active");
    curF = t.dataset.f;
    render();
  });
});

document.getElementById("searchInput").addEventListener("input", function(ev){
  curS = ev.target.value;
  render();
});

const root = document.documentElement;
const toggle = document.getElementById("themeToggle");

toggle.addEventListener("click", function(){
  const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", next);
  try{ localStorage.setItem("poggio-theme", next); }catch(e){}
});

buildStats();
render();
</script>
</body>
</html>
